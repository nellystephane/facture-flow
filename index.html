    <title>FactuFlow — Facturation & Gestion pour PME</title>
    <!-- GitHub Pages ne sait servir que des fichiers statiques : un lien direct
         ou un rafraîchissement sur une route interne (ex: /facture-flow/app/factures/123)
         renverrait une vraie 404 sans ce script. Il restaure la bonne URL après le
         redirect fait par public/404.html, avant que React Router ne démarre.
         Voir https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
