name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      # Filet de sécurité minimal : détecte immédiatement un fichier requis
      # au démarrage mais absent/mal placé (ex: le bug qui a cassé le
      # déploiement Render — un require() vers un fichier inexistant), sans
      # attendre que ça casse en production.
      - name: Vérification de syntaxe (tous les fichiers backend)
        working-directory: ./backend
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            out=$(node --check "$f" 2>&1) || { echo "❌ $f"; echo "$out"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "✅ Tous les fichiers backend sont syntaxiquement valides"
          exit $fail

      - name: Vérifier que le serveur démarre sans planter (imports résolus)
        working-directory: ./backend
        run: node -e "require('./server.js'); console.log('✅ server.js s\'importe sans erreur (routes/contrôleurs/modèles bien résolus)');"

      - name: Tests automatisés
        working-directory: ./backend
        run: npm test
